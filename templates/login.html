<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - markspredict</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#062b57',
                            900: '#043873',
                            950: '#02234a',
                        },
                        brand: {
                            blue: '#4F9CF9',
                            yellow: '#FFE492',
                            ice: '#F7F9FC',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-900 text-white font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-blue selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="bg-navy-900 border-b border-navy-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            
            <!-- Logo -->
            <a href="/" class="flex items-center space-x-3 group">
                <div class="w-9 h-9 bg-brand-blue rounded-lg flex items-center justify-center text-navy-900 font-extrabold text-xl shadow-md">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <span class="text-2xl font-extrabold tracking-tight text-white">markspredict</span>
            </a>

            <!-- Action Link -->
            <div class="flex items-center space-x-3">
                <span class="text-slate-300 text-sm hidden sm:inline">Need an account?</span>
                <a href="/register/" class="px-4 py-2 rounded-lg bg-brand-yellow hover:bg-amber-300 text-navy-900 font-bold text-xs sm:text-sm transition shadow">
                    Register free
                </a>
            </div>

        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
        
        <div class="bg-white text-slate-800 rounded-2xl shadow-2xl p-6 sm:p-10 w-full max-w-md border border-slate-100 relative">
            
            <!-- Card Header -->
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-navy-900 tracking-tight">Welcome Back</h1>
                <p class="text-slate-500 text-sm mt-2">Log in to access your student prediction dashboard</p>
            </div>

            <!-- Alert Message Block -->
            <div id="message" class="hidden mb-6 p-4 rounded-xl text-sm font-semibold bg-red-50 text-red-600 border border-red-200 transition"></div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-navy-900 uppercase tracking-wider mb-2">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-transparent text-sm font-medium text-slate-800 transition"
                    >
                </div>

                <div>
                    <label class="block text-xs font-bold text-navy-900 uppercase tracking-wider mb-2">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-transparent text-sm font-medium text-slate-800 transition"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full py-3.5 px-4 bg-brand-blue hover:bg-blue-600 text-white font-bold rounded-lg shadow-lg shadow-blue-500/25 transition transform active:scale-[0.98] cursor-pointer text-sm"
                >
                    Sign In to Dashboard
                </button>
            </form>

            <!-- Card Footer -->
            <div class="mt-8 pt-6 border-t border-slate-100 text-center text-xs sm:text-sm text-slate-600">
                Don't have an account yet? 
                <a href="/register/" class="font-bold text-brand-blue hover:underline ml-1">Create an account</a>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-navy-950 text-slate-400 py-6 border-t border-navy-800 text-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 markspredict. All rights reserved.</p>
            <div class="flex items-center space-x-6">
                <a href="/" class="hover:text-white transition">Home</a>
                <a href="/register/" class="hover:text-white transition">Register</a>
                <a href="/swagger/" class="hover:text-white transition">API Docs</a>
            </div>
        </div>
    </footer>

    <script>
        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const messageElem = document.getElementById("message");
                messageElem.classList.add("hidden");
                messageElem.innerText = "";

                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                try {
                    const response = await fetch(
                        "/api/token/",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                username: username,
                                password: password
                            })
                        }
                    );

                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem("access", data.access);
                        localStorage.setItem("refresh", data.refresh);
                        window.location.replace("/dashboard/");
                    } else {
                        messageElem.innerText = "Invalid username or password.";
                        messageElem.classList.remove("hidden");
                    }
                } catch (error) {
                    console.error("Login error:", error);
                    messageElem.innerText = "Server connection error. Please try again.";
                    messageElem.classList.remove("hidden");
                }
            });
    </script>

</body>
</html>
